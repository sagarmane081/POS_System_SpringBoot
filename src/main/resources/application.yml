spring:
  application:
    name: Sagar POS System

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/pos_system}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

server:
  port: 5000

# jwt.secret defaults to a dev-only placeholder; ALWAYS set JWT_SECRET explicitly outside local dev.
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-your-super-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}

# Set ADMIN_EMAIL/ADMIN_PASSWORD to bootstrap the first admin account on startup.
# No-op if either is unset, or if an admin already exists.
admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

# Per-client-IP request cap on /api/auth/login and /api/auth/register.
rate-limit:
  auth:
    max-requests: ${RATE_LIMIT_AUTH_MAX_REQUESTS:5}
    window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}

# CARD payments (Stripe). Blank secret-key/webhook-secret is fine for local
# dev/tests where no real payment ever happens; set real sandbox/live keys
# via env vars to actually create/confirm PaymentIntents.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:usd}

# UPI payments (Razorpay). Same as above - blank keys are fine until you're
# ready to test against a real Razorpay sandbox account.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}