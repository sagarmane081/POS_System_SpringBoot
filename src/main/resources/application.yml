spring:
  application:
    name: Sagar POS System

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/pos_system}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

server:
  port: 5000

# jwt.secret defaults to a dev-only placeholder; ALWAYS set JWT_SECRET explicitly outside local dev.
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-your-super-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}