spring:
  datasource:
    url: jdbc:h2:mem:pos-test-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

jwt:
  secret: integration-test-secret-key-integration-test-secret-key
  expiration: 3600000

# High limit so full-context tests hitting /api/auth/** repeatedly aren't
# rate-limited; RateLimitingFilterTest exercises the real limiting logic
# directly, and RateLimitingIntegrationTest overrides this to a tight value.
rate-limit:
  auth:
    max-requests: 100000
    window-seconds: 60
